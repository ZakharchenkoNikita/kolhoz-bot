<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kolhoz Dashboard</title>
    <link rel="stylesheet" href="style.css?v=6">
    <link href="https://fonts.cdnfonts.com/css/sf-pro-display" rel="stylesheet">
</head>
<body>
    <div class="bg-shape shape-1"></div>
    <div class="bg-shape shape-2"></div>

    <div class="app-container">
        <header class="glass-panel header">
            <div class="header-info">
                <div class="header-title-row" id="account-dropdown-trigger">
                    <h1 id="header-nickname">Kolhoz Bot</h1>
                    <svg class="chevron-icon" id="account-chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
                </div>
                
                <div style="display:flex; align-items:center; gap:10px; margin-top:5px;">
                    <p class="subtitle" id="status-text" style="margin:0;">🟢 Сервер подключен</p>
                    <div id="header-level-badge" style="background: rgba(255,255,255,0.1); padding: 3px 10px; border-radius: 12px; font-size: 13px; font-weight: 600; display: none;">Ур. 0</div>
                    <div id="header-id-badge" style="background: rgba(255,255,255,0.05); padding: 3px 10px; border-radius: 12px; font-size: 13px; font-weight: 600; display: none; color: var(--text-muted);">ID: --</div>
                </div>

                <div class="kb-account-dropdown" id="account-dropdown-menu">
                    <div class="kb-dropdown-list" id="dropdown-accounts-list">
                        </div>
                    <div class="kb-dropdown-add" id="dropdown-add-btn">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                        Добавить аккаунт
                    </div>
                </div>
            </div>
            
            <div class="header-actions">
                <span class="kb-action-icon" title="Журнал">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
                </span>
                
                <span class="kb-action-icon" id="btn-worker" title="Работники (Автоматизация)">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                </span>

                <span class="kb-action-icon" id="btn-recipes" title="Книга рецептов">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path><circle cx="12" cy="10" r="2"></circle></svg>
                </span>
                
                <span class="kb-action-icon" id="btn-settings" title="Настройки">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                </span>

                <div style="width: 1px; height: 24px; background: rgba(255,255,255,0.2); margin: 0 10px;"></div>
                <label class="ios-switch">
                    <input type="checkbox" id="master-toggle" onchange="toggleMaster(this.checked)">
                    <span class="slider"></span>
                </label>
            </div>
        </header>

        <main class="modules-grid" id="modules-container"></main>
        
        <!-- 🏠 Карточка Домика (Футер) -->
        <div id="house-container" class="house-container" style="display: none;"></div>
    </div>

    <svg id="svg-reset" style="display:none;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.59-11.5l5.67 5.67"/>
    </svg>

    <div class="kb-modal-backdrop" id="settings-backdrop"></div>
    
    <div class="kb-modal" id="settings-modal">
        <div class="kb-nav-header">
            <div class="kb-nav-top">
                <div class="kb-nav-back-circle" id="settings-back" style="display:none;">
                    <svg width="10" height="16" viewBox="0 0 12 20" fill="none" style="margin-right:2px;"><path d="M10 2L2 10L10 18" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </div>
                <div class="kb-nav-title-ios" id="settings-title">Настройки</div>
                <div class="kb-nav-close" id="settings-close">Готово</div>
            </div>
        </div>
    <div class="kb-modal-body">
            <div id="view_main" class="kb-nav-page" style="display:block;">
                <div class="kb-ios-card">
                    <div class="kb-ios-row" onclick="switchNavView('view_accounts', 'Аккаунты')">
                        <div class="kb-ios-icon-wrap">
                            <div class="kb-ios-icon" style="background:var(--apple-green);">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                            </div>
                            Аккаунты
                        </div>
                        <span class="kb-ios-chevron">›</span>
                    </div>
                    <div class="kb-ios-row" onclick="switchNavView('view_modules', 'Управление модулями')">
                        <div class="kb-ios-icon-wrap">
                            <div class="kb-ios-icon" style="background:var(--apple-blue);">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="9" y1="21" x2="9" y2="9"></line></svg>
                            </div>
                            Модули
                        </div>
                        <span class="kb-ios-chevron">›</span>
                    </div>
                </div>
            </div>

            <div id="view_accounts" class="kb-nav-page" style="display:none;">
                <div class="kb-ios-group-title">Добавить аккаунт</div>
                <div class="kb-ios-card" style="padding: 15px 20px; display: flex; flex-direction: column; gap: 10px;">
                    <input type="text" id="acc_login" placeholder="Логин" style="background: rgba(255,255,255,0.1); border: 1px solid var(--glass-border); padding: 10px; border-radius: 8px; color: white; font-family: inherit; font-size: 15px;">
                    <input type="password" id="acc_password" placeholder="Пароль" style="background: rgba(255,255,255,0.1); border: 1px solid var(--glass-border); padding: 10px; border-radius: 8px; color: white; font-family: inherit; font-size: 15px;">
                    <button onclick="addNewAccount()" style="background: var(--apple-blue); color: white; border: none; padding: 12px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 15px; margin-top: 5px;">Добавить</button>
                </div>
                
                <div class="kb-ios-group-title" style="margin-top: 25px;">Список аккаунтов</div>
                <div class="kb-ios-card" id="accounts-list"></div>
            </div>

            <div id="view_modules" class="kb-nav-page" style="display:none;">
                <div class="kb-ios-group-title">Перетащите для изменения приоритета</div>
                <div class="kb-ios-card" id="modules-list-settings"></div>
            </div>
        </div>
    </div>

    <div class="kb-modal-backdrop" id="recipes-backdrop"></div>
    <div class="kb-modal" id="recipes-modal">
        <div class="kb-nav-header">
            <div class="kb-nav-top">
                <div class="kb-nav-title-ios">Книга рецептов</div>
                <div class="kb-nav-close" id="recipes-close">Готово</div>
            </div>
        </div>

        <div class="kb-modal-search">
            <div class="kb-search-input-wrap">
                <svg class="kb-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <input type="text" class="kb-search-input" id="recipe-search-input" placeholder="Поиск рецептов, специй, связей..." oninput="window.filterRecipes(this.value)">
            </div>
        </div>
        
    <div class="kb-modal-body" id="recipes-modal-body">
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
